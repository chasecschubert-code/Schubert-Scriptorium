<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquire | Schubert Scriptorium</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Background image for Inquire page */
        body {
            background-image: url('prism-eng-5.png');
            background-size: 120%;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Overlay to reduce image opacity without affecting text */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 26, 0.85);
            pointer-events: none;
            z-index: -1;
        }

        /* Ensure form container stays prominent */
        .form-container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

<header>
    <div class="nav-logo">SCHUBERT SCRIPTORIUM</div>
    <nav><a href="index.html">Home</a> <a href="collection.html">Collection</a> <a href="photos.html">Photos</a> <a href="about.html">About</a> <a href="contact.html">Inquire</a></nav>
</header>

<div class="container">
    <h1>Inquire to Purchase</h1>
    <div class="form-container">
        <form action="https://formspree.io/f/xrpzkqrw" method="POST">
            <div class="form-row">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-row">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-row">
                <label>Facsimile of Interest</label>
                <select name="product">
                    <option value="Gallery Standard">Gallery Edition ($45)</option>
                    <option value="Gallery Engraved">Gallery Edition Engraved ($60)</option>
                    <option value="Curator Standard">Curator's Prism ($65)</option>
                    <option value="Curator Engraved">Curator's Prism Engraved ($90)</option>
                    <option value="Custom">Custom Commission Inquiry</option>
                </select>
            </div>
            <div class="form-row">
                <label>Message / Request</label>
                <textarea name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn" style="width:100%;">Send Inquiry</button>
        </form>
    </div>
</div>

<footer>
    <div class="footer-brand">Schubert Scriptorium</div>
    <p>chasecschubert@gmail.com</p>
</footer>

</body>
</html>
