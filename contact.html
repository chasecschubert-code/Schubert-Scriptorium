<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquire | Schubert Scriptorium</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Inquire page: branded, high-contrast presentation only. */
        body { background: linear-gradient(180deg,#F7F3EA 0%,#EDE3D0 100%); color:#34312B; }
        body::before { content:none; }
        .container { max-width: 900px; padding: 3rem 1.25rem 1rem; }
        .container h1 { font-family:'Playfair Display',serif; color:#8D6828; font-size:clamp(2rem,4vw,2.8rem); line-height:1.25; margin:0 0 1.8rem; }
        .form-container { position:relative; z-index:1; max-width:650px; background:#FDFBF6; border:1px solid #B58A35; border-radius:6px; box-shadow:0 14px 35px rgba(38,60,56,.12); padding:clamp(1.25rem,4vw,2.75rem); }
        .form-row { text-align:left; margin-bottom:1.4rem; }
        .form-row label { display:block; color:#263C38; font-weight:700; letter-spacing:.08em; font-size:.83rem; margin-bottom:.45rem; }
        .form-row input,.form-row select,.form-row textarea { display:block; box-sizing:border-box; width:100%; background:#FFFFFF; color:#263C38; border:1px solid #AFA48F; border-radius:4px; text-align:left; padding:.85rem 1rem; font-size:1rem; line-height:1.45; }
        .form-row select option { background:#FFFFFF; color:#263C38; }
        .form-row input:focus-visible,.form-row select:focus-visible,.form-row textarea:focus-visible { outline:2px solid #B58A35; outline-offset:2px; border-color:#8D6828; }
        .form-container .btn { background:#263C38; color:#F7F3EA; border:1px solid #263C38; border-radius:4px; padding:.95rem 1rem; font-size:.9rem; letter-spacing:.08em; }
        .form-container .btn:hover,.form-container .btn:focus-visible { background:#34564F; color:#FFFFFF; }
        footer { margin-top:3rem; }
        footer p { color:#34312B; }
        @media(max-width:600px) { .container { padding:2rem 1rem 0; } .form-container { padding:1.4rem 1rem; } }

        /* Product photography flanking the order form on wide screens only. */
        .order-showcase { display: none; }
        @media (min-width: 1100px) {
            .container.order-layout { max-width: 1500px; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,650px) minmax(0,1fr); gap: clamp(1rem,2.4vw,2.5rem); align-items: center; }
            .order-layout > h1 { grid-column: 1 / -1; }
            .order-layout > .form-container { grid-column: 2; grid-row: 2; width: 100%; }
            .order-showcase { display: flex; flex-direction: column; gap: 1.4rem; grid-row: 2; align-self: stretch; justify-content: center; }
            .order-showcase--left { grid-column: 1; }
            .order-showcase--right { grid-column: 3; }
            .order-showcase figure { margin: 0; padding: .5rem; background: #FDFBF6; border: 1px solid #B58A35; box-shadow: 0 12px 28px rgba(38,60,56,.14); }
            .order-showcase img { width: 100%; height: clamp(185px,19vw,275px); display: block; object-fit: contain; background: #F7F3EA; }
            .order-showcase figure:first-child { transform: rotate(-2deg); }
            .order-showcase figure:last-child { transform: rotate(2deg); }
            .order-showcase--right figure:first-child { transform: rotate(2deg); }
            .order-showcase--right figure:last-child { transform: rotate(-2deg); }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-logo">SCHUBERT SCRIPTORIUM</div>
    <div class="nav-tagline">A Witness to the Truth</div>
    <nav><a href="index.html">Home</a> <a href="collection.html">Collection</a> <a href="explore-p52.html">Explore P52</a> <a href="photos.html">Photos</a> <a href="about.html">About</a> <a href="contact.html">Order</a></nav>
</header>

<div class="container order-layout">
    <h1>Inquire to Purchase</h1>
    <aside class="order-showcase order-showcase--left" aria-label="Gallery Edition product photographs">
        <figure><img src="p52-wood-eng.png" alt="Engraved Gallery Edition Papyrus 52 facsimile" loading="lazy"></figure>
        <figure><img src="p52-wood-std.png" alt="Gallery Edition Papyrus 52 facsimile" loading="lazy"></figure>
    </aside>
    <div class="form-container">
        <form action="https://formspree.io/f/xrpzkqrw" method="POST">
            <div class="form-row">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-row">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-row">
                <label>Facsimile of Interest</label>
                <select name="product">
                    <option value="Gallery Standard">Gallery Edition ($45)</option>
                    <option value="Gallery Engraved">Gallery Edition Engraved ($75)</option>
                    <option value="Curator Standard">Curator's Prism ($50)</option>
                    <option value="Curator Engraved">Curator's Prism Engraved ($90)</option>
                    <option value="Custom">Custom Commission Inquiry</option>
                </select>
            </div>
            <div class="form-row">
                <label>Message / Request</label>
                <textarea name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn" style="width:100%;">Send Inquiry</button>
        </form>
    </div>
    <aside class="order-showcase order-showcase--right" aria-label="Curator's Prism product photographs">
        <figure><img src="prism-eng-1.png" alt="Engraved Curator's Prism Papyrus 52 display" loading="lazy"></figure>
        <figure><img src="p52-prism-std.png" alt="Curator's Prism Papyrus 52 display" loading="lazy"></figure>
    </aside>
</div>

<footer>
    <div class="footer-brand">Schubert Scriptorium</div>
    <p>A Witness to the Truth</p>
    <p>orders@schubertscriptorium.com</p>
</footer>

</body>
</html>
