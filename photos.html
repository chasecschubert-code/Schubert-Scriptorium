<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos | Schubert Scriptorium</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- GALLERY PAGE SPECIFIC STYLES --- */
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .gallery-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Main image viewer */
        .main-image-viewer {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 2rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--gold);
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.5s ease-in-out;
        }

        /* Thumbnail ribbon container */
        .thumbnail-ribbon-container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--tan);
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .thumbnail-ribbon {
            display: flex;
            gap: 1rem;
            justify-content: flex-start;
        }

        .thumbnail {
            flex-shrink: 0;
            width: 90px;
            height: 90px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .thumbnail:hover img {
            opacity: 0.85;
        }

        .thumbnail.active {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .thumbnail.active img {
            opacity: 1;
        }

        /* Image counter */
        .image-counter {
            text-align: center;
            color: var(--tan);
            margin-top: 2rem;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .gallery-title {
                font-size: 2rem;
            }

            .thumbnail {
                width: 70px;
                height: 70px;
            }

            .thumbnail-ribbon-container {
                padding: 0.75rem;
            }

            .thumbnail-ribbon {
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-logo">SCHUBERT SCRIPTORIUM</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="photos.html">Photos</a>
        <a href="about.html">About</a>
        <a href="contact.html">Inquire</a>
    </nav>
</header>

<div class="gallery-container">
    <h1 class="gallery-title">Photos</h1>

    <!-- Main Image Viewer -->
    <div class="main-image-viewer">
        <img id="mainImage" src="Real-1.png" alt="Gallery Image" class="main-image">
    </div>

    <!-- Thumbnail Ribbon -->
    <div class="thumbnail-ribbon-container">
        <div class="thumbnail-ribbon" id="thumbnailRibbon">
            <!-- Thumbnails will be generated by JavaScript -->
        </div>
    </div>

    <!-- Image Counter -->
    <div class="image-counter">
        <span id="currentImage">1</span> / <span id="totalImages">7</span>
    </div>
</div>

<footer>
    <div class="footer-brand">Schubert Scriptorium</div>
    <p>Hand-Crafted & Hand-Delivered in DFW</p>
    <p>chasecschubert@gmail.com</p>
</footer>

<script>
    // Gallery configuration
    const totalImages = 7;
    const imageBaseName = 'Real-';
    const imageExtension = '.png';
    let currentIndex = 0;

    // Initialize gallery
    function initializeGallery() {
        const ribbon = document.getElementById('thumbnailRibbon');
        
        // Create thumbnail elements
        for (let i = 1; i <= totalImages; i++) {
            const thumbnail = document.createElement('div');
            thumbnail.className = 'thumbnail' + (i === 1 ? ' active' : '');
            thumbnail.onclick = () => selectImage(i - 1);
            
            const img = document.createElement('img');
            img.src = imageBaseName + i + imageExtension;
            img.alt = 'Thumbnail ' + i;
            
            thumbnail.appendChild(img);
            ribbon.appendChild(thumbnail);
        }
    }

    // Select an image
    function selectImage(index) {
        currentIndex = index;
        updateGallery();
    }

    // Update gallery display
    function updateGallery() {
        // Update main image
        const mainImage = document.getElementById('mainImage');
        mainImage.src = imageBaseName + (currentIndex + 1) + imageExtension;
        mainImage.alt = 'Gallery Image ' + (currentIndex + 1);

        // Update counter
        document.getElementById('currentImage').textContent = currentIndex + 1;

        // Update active thumbnail
        const thumbnails = document.querySelectorAll('.thumbnail');
        thumbnails.forEach((thumb, index) => {
            thumb.classList.toggle('active', index === currentIndex);
        });

        // Scroll thumbnail into view
        const activeThumbnail = thumbnails[currentIndex];
        activeThumbnail.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
            selectImage((currentIndex - 1 + totalImages) % totalImages);
        } else if (e.key === 'ArrowRight') {
            selectImage((currentIndex + 1) % totalImages);
        }
    });

    // Initialize on page load
    initializeGallery();
</script>

</body>
</html>
